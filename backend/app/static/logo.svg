<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 120" width="460" height="120"
     role="img" aria-label="CodeJury">
  <title>CodeJury</title>
  <!-- The full lockup: braces around a balance scale whose beam carries </>.
       Sized for a README header or a slide. The app chrome uses the scale
       alone (see icons.js) — at 28px the braces and the </> turn to mush. -->
  <g fill="none" stroke="currentColor" stroke-width="4.2"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- braces -->
    <path d="M46 20c-9 0-11 4-11 12v13c0 7-3 11-9 12 6 1 9 5 9 12v13c0 8 2 12 11 12"/>
    <path d="M104 20c9 0 11 4 11 12v13c0 7 3 11 9 12-6 1-9 5-9 12v13c0 8-2 12-11 12"/>
    <!-- </> on the beam -->
    <path d="M64 33.5 56.5 41l7.5 7.5"/>
    <path d="M86 33.5 93.5 41 86 48.5"/>
    <path d="m82 30-9 22"/>
    <!-- scale: beam, pans, post, base -->
    <path d="M55 60h40"/>
    <path d="m55 60-8 17h16z"/>
    <path d="m95 60-8 17h16z"/>
    <path d="M75 55v37"/>
    <path d="M63 92h24"/>
  </g>
  <text x="150" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="58"
        fill="currentColor">CodeJury</text>
</svg>
