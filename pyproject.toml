[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autodev-studio"
version = "0.1.0"
description = "A multi-agent SDLC harness: scope, code, test, review and ship changes to a real Git repo, grounded in a knowledge base of that repo."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Krish Agarwal" }]
keywords = ["llm", "agents", "sdlc", "rag", "code-generation", "developer-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Code Generators",
]

dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlmodel>=0.0.16",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "jinja2>=3.1",
  # Native Anthropic Messages API (the `anthropic` provider) + Fernet
  # encryption-at-rest for API keys saved from the Settings screen.
  "anthropic>=0.40",
  "cryptography>=42",
]

[project.optional-dependencies]
# Local knowledge base: free local embeddings + an embedded vector DB. Without
# these the RAG falls back to a pure-Python TF-IDF index (no extra deps).
semantic = [
  "fastembed>=0.3",
  "qdrant-client>=1.9",
]
# Exact symbol extraction + edit-time parse gates for JS/TS/Go/Rust/Java/Ruby
# via real parse trees (grammars lazy-loaded per language). Without it the
# language layer falls back to the built-in regex extractors — Python is
# always exact via stdlib ast either way.
treesitter = [
  "tree-sitter>=0.23",
  "tree-sitter-language-pack>=0.7",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/krishagarwal314/autodev-studio"
Documentation = "https://github.com/krishagarwal314/autodev-studio/tree/main/docs"
Issues = "https://github.com/krishagarwal314/autodev-studio/issues"

[project.scripts]
autodev = "app.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*"]

# ── Lint ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".workspace", ".knowledge", ".qdrant", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
  "E501",   # long lines are covered by the formatter, not worth failing CI over
  "B008",   # FastAPI's Depends() in defaults is the framework's own idiom
  "SIM105", # contextlib.suppress is not always clearer than try/except: pass
  "E741",   # single-letter loop vars (l, e) read fine in the short scopes here
  "B904",   # explicit `raise ... from` — the re-raised HTTPExceptions are intentional
  "UP042",  # str-Enum migration; the plain Enum + .value pattern is used deliberately
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

# ── Tests ─────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "-q --strict-markers"
filterwarnings = [
  "ignore::DeprecationWarning",
]
markers = [
  "slow: tests that hit the filesystem or spawn subprocesses",
]
