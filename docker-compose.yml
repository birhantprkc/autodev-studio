# AutoDev Studio — single self-contained service.
#   docker compose up --build   →   http://localhost:8017
#
# The admin password is generated on first boot and printed to the log; read it
# with `docker compose logs app`, or preset one via ADMIN_PASSWORD below.
services:
  app:
    build: .
    ports:
      - "8017:8017"
    environment:
      # Provide keys here or via a .env file next to this compose file.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      RAG_BACKEND: local
      RAG_EMBEDDINGS: tfidf
      DEMO_MODE: "true"           # dry-run PRs; set false only for a repo you own
      SEED_ON_STARTUP: "false"
      # Keep the SQLite DB on the mounted volume (see below), not the image.
      DATABASE_URL: sqlite:////data/sdlc_agents.db
    volumes:
      # Persist the SQLite DB and cloned working copies across restarts.
      - autodev-data:/data
      - autodev-workspace:/workspace

volumes:
  autodev-data:
  autodev-workspace:
